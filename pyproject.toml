[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restoregate"
version = "0.1.0"
description = "Offline backup-archive recoverability gate with safe restore drills and machine-readable evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Felipe Silva"}]
keywords = ["backup", "disaster-recovery", "security", "restore", "zip", "tar", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Security", "Topic :: System :: Archiving :: Backup"]

[project.scripts]
restoregate = "restoregate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
